dynamics2d:
  mu1: 1.0078825
  mu2: 1.0078825
  grid_x1:
    start: -0.35
    dx: 0.05
    npoints: 34
  grid_x2:
    start: -0.35
    dx: 0.05
    npoints: 34
  time:
    dt: 0.1
    nsteps: 1024
  sampling:
    mode: 1
    npoints_x1: 2
    npoints_x2: 2
    npoints_p1: 2
    npoints_p2: 2
  pes_initial: input/tmpGS.pes.dat
  pes_dynamics: input/tmpCH.pes.dat
  index_order: F
  outfile: dynamics_2d_out

interpolation2d:
  dipole_mode: DIPOLE
  dipole_components: 3
  pes_final_list:
    - input/tmpVH001.pes.dat
    - input/tmpVH002.pes.dat
    - input/tmpVH003.pes.dat
  dipole_final_list:
    - input/tmpVH001.dip.dat
    - input/tmpVH002.dip.dat
    - input/tmpVH003.dip.dat

spectrum:
  gamma_fwhm: 0.15
